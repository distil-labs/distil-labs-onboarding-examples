base:
  task: question-answering
  student_model_name: Qwen3.5-0.8B
  teacher_model_name: zai.glm-5.3-flash-low-thinking
  llm_num_parallel_requests: 32

evaluation:
  llm_as_a_judge_model_name: zai.glm-5.3-flash-low-thinking

tuning:
  num_train_epochs: 4
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8

synthgen:
  generation_target: 512
  generation_iteration_size: 128
  output_is_json: true
  # The severity rules key off component and level only, so these two mutators generate every
  # component at every level, including the exception cases (authentication at FATAL, database
  # and payments at ERROR).
  mutators:
    - name: component
      values:
        - "authentication services"
        - "payment services"
        - "database services"
        - "ingest and queueing services"
        - "frontend and edge services"
        - "search and indexing services"
    - name: level
      values:
        - "lines logged at FATAL level"
        - "lines logged at ERROR level"
        - "lines logged at WARN level"
        - "lines logged at INFO level"
