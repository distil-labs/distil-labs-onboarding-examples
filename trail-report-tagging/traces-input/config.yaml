base:
  task: question-answering
  student_model_name: Qwen3.5-2B
  # The large teacher: the IMPASSABLE override is a rule the small one breaks in relabelling
  # and generation.
  teacher_model_name: zai.glm-5.3-low-thinking
  llm_num_parallel_requests: 32

evaluation:
  llm_as_a_judge_model_name: zai.glm-5.3-low-thinking

tuning:
  # 2 epochs at most. A batch of 4 and 4x the default learning rate give the optimizer enough
  # steps to commit a 48-code vocabulary to memory in those 2 passes.
  num_train_epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8

synthgen:
  generation_target: 128
  generation_iteration_size: 128
  output_is_json: true
  # The answers are JSON inside JSON, so the teacher runs at the bottom of the range for a
  # reasoning teacher (0.5-0.7) to keep the escaping correct.
  teacher_temperature: 0.5
  # One dimension: the tag families and the two rule cases that carry the gap to the base
  # model, the IMPASSABLE override and the empty tag list. Read the coverage in the output:
  # a mutator value is a request and can produce nothing.
  mutators:
    - name: report_topic
      values:
        - "reports where the trail is blocked outright and other conditions are also described"
        - "reports where the trail is in good order and nothing is reportable"
        - "reports about degraded trail structures, signage and route marking"
        - "reports about seasonal snow, ice, water and mud conditions"
        - "reports about camps, bugs, crowding and trailhead conditions"
        - "reports that turn on a close-neighbour tag distinction"

trace_processing:
  teacher_model_name: zai.glm-5.3-low-thinking
  observation_format: openai_messages
  # 500 traces: the test set takes 100, which leaves 400 for these 350 and 50 unstructured rows.
  # The relabelled traces are the rows that carry the most: the test reports are written in the
  # same phrasings, and the generated rows are not.
  num_traces_as_training_base: 350
  relabel: true
  # Every trace is on-task by construction, so a relevance filter can only drop valid rows.
  relevance_filtering: false

traces_to_test_set:
  num_traces_to_relabel: 100
  num_synthetic_examples: 0
  # Scores the production model on the relabelled test set: the floor the student must beat.
  evaluate_original_model: true
  # 0 sets no floor on the relabelled test rows.
  min_relabelled_examples: 0
