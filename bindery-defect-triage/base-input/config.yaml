base:
  task: question-answering
  # Qwen3-0.6B: each evaluation inside the training job takes about 4.5 minutes, against 7
  # for Qwen3.5-0.8B, almost all of it vLLM start-up. The deployment starts faster too.
  student_model_name: Qwen3-0.6B
  teacher_model_name: zai.glm-5.3-flash-low-thinking
  llm_num_parallel_requests: 32

tuning:
  # One epoch: the loss is below 0.03 before the end of it, and each further epoch adds
  # about a minute of fixed overhead to the job.
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8

synthgen:
  train_generation_target: 512
  generation_iteration_size: 128
  # One value per code, each naming the station and severity that lead to it, so the value
  # fixes the answer. No station or severity mutator: those lead the teacher to the wrong
  # label. synthetic_data_generation_instructions spreads the rows over every alias instead.
  mutators:
    - name: label
      description: which disposition code the inspection line resolves to
      values:
        - "a line whose correct code is rebind_unit: a folding, gathering or trimming alias at critical severity"
        - "a line whose correct code is rework_signature: a folding, gathering or trimming alias at major severity"
        - "a line whose correct code is press_and_hold: any alias except a stamping one, at minor severity"
        - "a line whose correct code is mark_and_pass: a stamping alias at any severity, or any other alias at trace severity"
        - "a line whose correct code is quarantine_lot: a gluing or casing alias at critical or major severity"
