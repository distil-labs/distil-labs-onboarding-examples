base:
  task: classification
  # Qwen3-0.6B: each evaluation inside the training job takes about 4.5 minutes, against 7
  # for Qwen3.5-0.8B, almost all of it vLLM start-up. The deployment starts faster too.
  student_model_name: Qwen3-0.6B
  teacher_model_name: zai.glm-5.3-flash-low-thinking
  llm_num_parallel_requests: 32

evaluation:
  # 5 classes: the teacher sees one few-shot example per class.
  num_few_shot_examples: 5

tuning:
  # One epoch: the loss is below 0.03 before the end of it, and each further epoch adds
  # about a minute of fixed overhead to the job.
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8

synthgen:
  train_generation_target: 512
  generation_iteration_size: 128
  # No mutators. A station or severity mutator leads the teacher to the wrong label in this
  # classification task; synthetic_data_generation_instructions spreads the rows over every
  # alias and severity instead.
